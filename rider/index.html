async function api(action,extra){
 const code=localStorage.getItem(CK)||'';const ctl=new AbortController();const t=setTimeout(()=>ctl.abort(),12000);
 try{const r=await fetch(API,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(Object.assign({code,action},extra||{})),signal:ctl.signal,cache:'no-store'});

  if(r.status===401&&action!=='me')logout('Tu código ya no es válido. Vuelve a entrar.');return j}

let drag=null,hap=false;
document.addEventListener('pointerdown',e=>{const k=e.target.closest('.knob');if(!k)return;const sl=k.parentElement;k.classList.remove('snap');drag={k,sl,x0:e.clientX,max:sl.clientWidth-k.clientWidth-6,dx:0};hap=false;try{k.setPointerCapture(e.pointerId)}catch(x){}e.preventDefault()});
document.addEventListener('pointermove',e=>{if(!drag)return;const dx=Math.max(0,Math.min(drag.max,e.clientX-drag.x0));drag.dx=dx;drag.k.style.transform=`translateX(${dx}px)`;drag.sl.style.setProperty('--p',dx/drag.max);if(dx>drag.max*.8&&!hap){hap=true;tick()}});
document.addEventListener('pointerup',()=>{if(!drag)return;const d=drag;drag=null;if(d.dx>d.max*.8){d.k.style.transform=`translateX(${d.max}px)`;act(d.sl.dataset.sl)}else{d.k.classList.add('snap');d.k.style.transform='';d.sl.style.setProperty('--p',0)}});
